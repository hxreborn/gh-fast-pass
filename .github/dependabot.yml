version: 2
updates:
  - package-ecosystem: "gradle"
    ignore:
      - dependency-name: "io.github.libxposed:*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "ci(deps)"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
